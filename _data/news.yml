- date: November 2025
  headline: We welcome Lena to the [Microscope lab](/microscope) and Navraj to the [CsYb lab](/csyb). And huge congratulations to Dan on winning the Entanglement Prize at the Quantum Talents Symposium in Munich for his outstanding research on quantum computing. Read more [here](https://www.munich-quantum-valley.de/news-events/detail/quantum-talents-symposium-2025).

- date: October 2025
  headline: We welcome Rob to the [Microscope lab](/microscope) and Niamh and Ikenna to the [Molecular BEC lab](/molecularbec).

- date: September 2025
  headline: Congratulations to Jonathan on receiving a Physics Department Award for Excellence for his research in the [Microscope lab](/microscope)!

- date: September 2025
  headline: We are excited to begin work on our new EPSRC Programme Grant on "Quantum many-body physics with ultracold molecules" with collaborators at Birmingham, Imperial and Kings.

- date: August 2025
  headline: Congratulations Tom and the [Tweezer lab](/tweezers) for their latest publication on [Long-lived multilevel coherences and spin-1 dynamics encoded in the rotational states of ultracold molecules](https://doi.org/10.1038/s41467-025-62275-y)

- date: July 2025
  headline: Simon participates in the summer worksop on "Cold and Ultracold Molecules" at the [Aspen Center for Physics](https://aspenphys.org/).

- date: June 2025
  headline: We were proud to show Professor Maria Leptin, President of the European Research Council, our labs on her visit to Durham. Read more [here](https://www.durham.ac.uk/news-events/latest-news/2025/06/european-research-council-scientific-council-visit/).

- date: June 2025
  headline: Congratulations to Dr Adarsh Raghuram for a successful defence of his [thesis](https://etheses.dur.ac.uk/16234/)!

- date: May 2025
  headline: Congratulations to Dan for the award of the Alan Martin Doctoral Prize for the best PhD thesis in physics in 2025! Read the award-winning thesis [here](https://etheses.dur.ac.uk/15697/).
